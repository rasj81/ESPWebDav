; Compile check only. It mirrors the Arduino IDE settings used for the real build
; (taken from the IDE's build.options.json on 2026-11-05); flashing is still done from Arduino IDE.
;   Arduino IDE board: Generic ESP8285 Module (esp8266 core 3.1.2)
;   fqbn: esp8266:esp8266:esp8285:led=2,baud=115200,xtal=160,CrystalFreq=26,eesz=autoflash,
;         ResetMethod=nodemcu,dbg=Disabled,lvl=None____,ip=lm2f,vt=flash,exception=disabled,
;         stacksmash=disabled,wipe=none,sdk=nonosdk_190703,ssl=all,mmu=3232,non32xfer=fast
; Build with:  pio run
; There is deliberately no upload_port, so `pio run -t upload` can't flash anything by accident.

[env:sdwifi]
platform = espressif8266@4.2.1          ; Arduino-ESP8266 core 3.1.2, same as the IDE build
board = esp8285
framework = arduino
monitor_speed = 115200

board_build.f_cpu = 160000000L          ; xtal=160 (CPU 160 MHz); crystal stays at the core default, 26 MHz
board_build.ldscript = eagle.flash.auto.ld   ; eesz=autoflash: flash map comes from the chip and sketch

build_flags =
  -DLED_BUILTIN=2                                 ; led=2
  -DFLASH_MAP_SUPPORT=1                           ; eesz=autoflash
  -DPIO_FRAMEWORK_ARDUINO_ESPRESSIF_SDK190703     ; sdk=nonosdk_190703
  -DPIO_FRAMEWORK_ARDUINO_LWIP2_LOW_MEMORY        ; ip=lm2f (v2 Lower Memory)
  -DPIO_FRAMEWORK_ARDUINO_MMU_CACHE32_IRAM32      ; mmu=3232 (32 KB cache + 32 KB IRAM)
  -DVTABLES_IN_FLASH                              ; vt=flash

; The sketch sits at the repo root (Arduino IDE layout), so build from here and skip the examples.
src_dir = .
build_src_filter = +<*.cpp> +<*.ino> -<examples/> -<build/> -<backup_v10/> -<.pio/>
