# FYSETC WebDAV settings. Lines starting with # are comments.
# Required:
SSID=xxxx
PASSWORD=xxxx

# Wi-Fi security. The board always reads what the network uses; these set the
# weakest it will accept. Blank or AUTO = the most secure this chip supports.
# WIFI_SECURITY: WPA2 (default) | WPA | WEP | OPEN   (WPA3 is not supported by the ESP8285)
# WIFI_CIPHER:   AES (default)  | TKIP/AES
WIFI_SECURITY=AUTO
WIFI_CIPHER=AUTO

# Device name. Reach it as printer1.local, or printer1.<your router's domain>
HOSTNAME=e3v2-dd

# 1 = rename this file to SETUP.BAK after Wi-Fi connects and the settings are
#     saved in the board (card is "disarmed"). 0 = keep SETUP.INI.
RENAME=0

# DHCP (default) or STATIC. For STATIC, IP and SUBNET are required.
# GATEWAY is needed for internet time; DNS defaults to the gateway.
IP_MODE=DHCP
#IP=192.168.1.50
#SUBNET=255.255.255.0
#GATEWAY=192.168.1.1
#DNS=192.168.1.1

# 1 = file manager over https://<name>.local/_manager (plain http:// redirects
#     there). The board makes its own certificate the first time; browsers warn
#     until you install it from http://<name>.local/_cert as trusted.
#     WebDAV drive mapping keeps using http://. Needs about 25 KB free memory.
# 0 = http only (default)
HTTPS=0

# Sharing the card with the printer. There is no wire that lets the two take
# turns, so the board stays off the card for PRINTER_WAIT seconds (1-60,
# default 5) after it last saw the printer use it. The file manager's
# "Give card to printer" button (or M58 PRINTER) makes the board leave the card
# alone completely, e.g. while printing or while Finder has the drive open;
# "Use card from here" (or M58 NETWORK) shares it again. The board always
# starts in shared (Network) mode.
PRINTER_WAIT=5

# Status LED. AUTO: flashes once a second when Wi-Fi is up, twice a second while
# the printer is using the card, slow even blink in Printer mode, solid while
# this board is using the card, and blinks the IP address once after power-up
# (3 fast flashes, then each digit as that many flashes with 0 as one long flash,
# a long pause at each dot, 3 fast flashes to finish; 10.0.0.24 = 1, long, long,
# long, 2, 4). ON / OFF = always on / always off (no IP blink). M60 changes it
# until restart, M60 IP repeats the address.
LED=AUTO

# Login for the WebDAV drive and the file manager.
# AUTH=1 asks for DAV_USER / DAV_PASSWORD; AUTH=0 (default) lets anyone on your
# network in. The password is never sent in clear text over http (Digest login,
# which macOS Finder, Windows and Linux all support). The user name can't
# contain ':'. If either is empty, no login is required.
# Windows: map the drive as \\<ip>\DavWWWRoot.  Mac Finder: http://<ip>/
AUTH=0
DAV_USER=
DAV_PASSWORD=

# Log files on this card. Each area: 0 = off, 1 = sparse (errors only),
# 2 = normal, 3 = verbose.
# network.log: Wi-Fi, IP address, signal, SETUP.INI, rename.
#   2 adds a status line every 15 minutes, 3 every minute.
LOG_NETWORK=2
# webdav.log: uploads, downloads, deletes, moves, new folders
LOG_FILES=2
# webdav.log: WebDAV requests. 1 = requests turned away (printer busy),
#   2 = also LOCK/OPTIONS/404s, 3 = every request including folder browsing
LOG_WEBDAV=1

# Time zone for log timestamps (POSIX format). Empty = UTC.
# US Eastern: EST5EDT,M3.2.0,M11.1.0   US Pacific: PST8PDT,M3.2.0,M11.1.0
TZ=

# ---------------------------------------------------------------------------
# Serial commands (send them from the printer's console, e.g. Pronterface or
# OctoPrint's terminal). They use the same setting names as this file.
#
#   M50              List all settings (the password is hidden).
#   M50 KEY=VALUE    Change one setting, e.g.  M50 HOSTNAME=printer2
#                    Type \; for a ; inside a value (e.g. in a password).
#                    LOG_*, TZ and HTTPS take effect right away; Wi-Fi, name
#                    and IP settings need M52 to reconnect.
#   M51              Save the current settings to the board's flash.
#   M52              Connect (or reconnect) to Wi-Fi with the current settings.
#   M53              Status: Wi-Fi, IP address, signal, names, card, HTTPS,
#                    free memory and firmware build.
#   M54              Scan for Wi-Fi networks and show their security.
#   M55              Show the date, time and uptime.
#   M55 YYYY-MM-DD HH:MM[:SS]
#                    Set the clock (local time) when there is no internet time.
#   M56              HTTPS certificate info: names, dates, SHA-256 fingerprint.
#   M56 NEW          Make a new HTTPS certificate.
#   M57              Install FIRMWARE.BIN from the card now (see below).
#   M58              Show who may use the card. M58 PRINTER leaves it to the
#                    printer only, M58 NETWORK shares it again.
#   M59              Restart the board.
# ---------------------------------------------------------------------------

# Firmware update: in Arduino IDE use Sketch > Export Compiled Binary, copy the
# .bin to the card as FIRMWARE.BIN and restart the board (or send M57). It is
# installed and renamed to FIRMWARE.BAK; a bad file is renamed to FIRMWARE.BAD
# and the old firmware keeps running. The file manager's "Update firmware"
# button does the same over the network, but only when a login is set
# (AUTH=1 with DAV_USER and DAV_PASSWORD); otherwise it is switched off.
# Keep the board powered while it installs.
# On a 1MB board the firmware is too big to install uncompressed, so it is
# compressed for you: the web page gzips the .bin before sending it, and a
# FIRMWARE.BIN on the card is compressed on the card first (takes a minute).
# A file you gzipped yourself (gzip -9, as .bin.gz / FIRMWARE.GZ) also works.
# Use Tools > Flash Size "1MB (FS:none OTA:~502KB)" for the most room.
